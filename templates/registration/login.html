{% extends "base.html" %}
{% block title %}Entrar · Portfólio{% endblock %}
{% block content %}<section class="panel">
  <h2>Entrar</h2>
  <p class="muted">Use uma conta criada pelo administrador do Django.</p>
  {% if form.errors %}<p class="errorlist">Usuário ou senha inválidos.</p>{% endif %}
  <form method="post">{% csrf_token %}{{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="button" type="submit">Entrar</button>
  </form>
</section>{% endblock %}
